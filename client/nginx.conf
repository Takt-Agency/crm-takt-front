server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Les fichiers du bundle portent une empreinte dans leur nom : ils peuvent
  # etre caches indefiniment, contrairement a index.html qui doit toujours
  # etre relu pour que le navigateur decouvre un nouveau deploiement.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # L'API est servie sous la meme origine que l'interface. Deux consequences :
  # aucune requete inter-origine, donc plus de CORS a configurer ; et le
  # bundle peut appeler « /api/... » en relatif, ce qui rend l'image frontend
  # independante de l'adresse du serveur — elle se deploie telle quelle en
  # local comme en production.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Les televersements de justificatifs peuvent depasser la limite par
    # defaut de nginx (1 Mo) ; le serveur accepte jusqu'a 6 Mo.
    client_max_body_size 8m;
  }

  # Justificatifs de decaissement et releves bancaires, servis par le backend
  # depuis son volume.
  location /uploads/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
  }

  # Toute autre adresse revient a l'application React, qui gere son propre
  # routage cote navigateur.
  location / {
    try_files $uri /index.html;
  }
}
