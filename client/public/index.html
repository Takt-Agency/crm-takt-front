<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff1f8f" />
    <meta
      name="description"
      content="Nexia Digital CRM - gestion clients, pipeline, finances et RH"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Nexia Digital CRM</title>

    <!--
      Pose data-theme avant le premier rendu.
      Sans ce script, la page s'affiche en clair pendant quelques centaines de
      millisecondes avant que React ne monte, ce qui provoque un flash blanc
      desagreable pour les utilisateurs en mode sombre.
      La cle de stockage doit rester alignee sur STORAGE_KEY de ThemeContext.js.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nexia-theme");
          var mode =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    <div id="root"></div>
  </body>
</html>
